
{% extends "base.html" %}
{% block content %}
<h1>Promote Your Project</h1>
<p class="muted">Wallet for invoices: {{ wallet or 'Set TON_WALLET_ADDRESS in .env' }}</p>
<form method="post" action="/promote/create" enctype="multipart/form-data" class="stack card">
  <div class="grid two">
    <label>Service Type<select name="service_type"><option value="trending">Trending</option><option value="ads">Ads</option><option value="verification">Verification</option><option value="listing">Listing</option></select></label>
    <label>Package<select name="package_name"><option value="1h">Trending 1h</option><option value="3h">Trending 3h</option><option value="6h">Trending 6h</option><option value="12h">Trending 12h</option><option value="24h">Trending 24h</option><option value="1d">Ads 1d</option><option value="3d">Ads 3d</option><option value="7d">Ads 7d</option><option value="standard">Standard</option></select></label>
    <label>Your Name<input name="customer_name"></label>
    <label>Telegram Username<input name="customer_username" placeholder="@username"></label>
    <label>Token Name<input name="token_name" required></label>
    <label>Token Symbol<input name="token_symbol"></label>
    <label>Contract Address<input name="contract_address" required></label>
    <label>Telegram Link<input name="telegram_link"></label>
    <label>Website Link<input name="website_link"></label>
    <label>X Link<input name="x_link"></label>
    <label>Media Upload<input type="file" name="media" accept="image/*,video/*,.gif"></label>
  </div>
  <label>Notes<textarea name="notes" rows="5"></textarea></label>
  <button class="btn" type="submit">Create Invoice</button>
</form>
{% endblock %}
